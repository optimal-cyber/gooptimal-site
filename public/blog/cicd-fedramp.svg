<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <marker id="sunArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#ff8a3d"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="56" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#ff8a3d">PUBLIC SECTOR CI/CD</text>
  <text x="56" y="94" font-size="27" font-weight="600" fill="#eef1f7">Build outside. Pull across. Promote through humans.</text>

  <!-- authorization boundary -->
  <rect x="380" y="124" width="764" height="376" rx="16" fill="rgba(255,138,61,0.03)" stroke="rgba(255,138,61,0.45)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="404" y="154" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#ff8a3d">INSIDE THE AUTHORIZATION BOUNDARY</text>
  <text x="56" y="154" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#6b7382">OUTSIDE</text>

  <!-- outside: source + CI -->
  <rect x="56" y="190" width="252" height="170" rx="14" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
  <text x="84" y="226" font-size="15" font-weight="600" fill="#9aa3b2">GitHub / GitLab CI</text>
  <text x="84" y="256" font-size="12.5" fill="#6b7382">source and CI runners</text>
  <text x="84" y="276" font-size="12.5" fill="#6b7382">not FedRAMP authorized</text>
  <text x="84" y="296" font-size="12.5" fill="#6b7382">no federal data, ever</text>

  <!-- pull across -->
  <line x1="308" y1="272" x2="400" y2="272" stroke="#ff8a3d" stroke-width="2" marker-end="url(#sunArrow)"/>
  <text x="344" y="240" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">pull,</text>
  <text x="344" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">never push</text>

  <!-- inside: three stages -->
  <rect x="416" y="190" width="224" height="170" rx="14" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
  <text x="440" y="226" font-size="15" font-weight="600" fill="#eef1f7">Build and scan gate</text>
  <text x="440" y="256" font-size="12.5" fill="#9aa3b2">SAST · DAST · SCA</text>
  <text x="440" y="276" font-size="12.5" fill="#9aa3b2">SBOM · secrets · image</text>
  <text x="440" y="296" font-size="12.5" fill="#9aa3b2">pass or fail, recorded</text>

  <line x1="640" y1="272" x2="684" y2="272" stroke="#ff8a3d" stroke-width="1.5" marker-end="url(#sunArrow)"/>

  <rect x="696" y="190" width="204" height="170" rx="14" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
  <text x="720" y="226" font-size="15" font-weight="600" fill="#eef1f7">Promotion gate</text>
  <text x="720" y="256" font-size="12.5" fill="#9aa3b2">a human approves</text>
  <text x="720" y="276" font-size="12.5" fill="#9aa3b2">every release, with the</text>
  <text x="720" y="296" font-size="12.5" fill="#9aa3b2">evidence in front of them</text>

  <line x1="900" y1="272" x2="944" y2="272" stroke="#ff8a3d" stroke-width="1.5" marker-end="url(#sunArrow)"/>

  <rect x="956" y="190" width="160" height="170" rx="14" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
  <text x="980" y="226" font-size="15" font-weight="600" fill="#eef1f7">Production</text>
  <text x="980" y="256" font-size="12.5" fill="#9aa3b2">change control</text>
  <text x="980" y="276" font-size="12.5" fill="#9aa3b2">least privilege</text>
  <text x="980" y="296" font-size="12.5" fill="#9aa3b2">continuous logs</text>

  <!-- separation of duties -->
  <text x="416" y="420" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#6b7382">SEPARATION OF DUTIES</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="416" y="434" width="180" height="38" rx="19" fill="#0e1018" stroke="rgba(255,255,255,0.16)"/>
    <text x="506" y="458" fill="#9aa3b2">developer</text>
    <text x="622" y="458" font-family="ui-monospace, Menlo, monospace" fill="#ff8a3d">≠</text>
    <rect x="648" y="434" width="180" height="38" rx="19" fill="#0e1018" stroke="rgba(255,255,255,0.16)"/>
    <text x="738" y="458" fill="#9aa3b2">dev approver</text>
    <text x="854" y="458" font-family="ui-monospace, Menlo, monospace" fill="#ff8a3d">≠</text>
    <rect x="880" y="434" width="180" height="38" rx="19" fill="#0e1018" stroke="rgba(255,255,255,0.16)"/>
    <text x="970" y="458" fill="#9aa3b2">prod approver</text>
  </g>

  <text x="56" y="540" font-size="14" fill="#ff8a3d">The runner never reaches in. Federal data never leaks out.</text>

  <line x1="56" y1="576" x2="1144" y2="576" stroke="rgba(255,255,255,0.06)"/>
  <text x="56" y="606" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">gooptimal.io · field notes</text>
  <text x="1144" y="606" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">FEDRAMP · IL4 / IL5 · NIST 800-53</text>
</svg>
