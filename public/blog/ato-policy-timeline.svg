<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 420" width="1456" height="420" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
  </defs>
  <rect width="1456" height="420" fill="url(#bg)"/>
  <text x="64" y="62" font-size="24" font-weight="600" fill="#eef1f7">Washington is pushing. The queue is not moving.</text>

  <line x1="100" y1="220" x2="1180" y2="220" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <line x1="1180" y1="220" x2="1392" y2="220" stroke="#5f6a80" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- milestones: above / below alternating -->
  <g>
    <circle cx="130" cy="220" r="7" fill="#ff8a3d"/>
    <text x="130" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">DEC 2024</text>
    <text x="130" y="188" text-anchor="middle" font-size="12.5" fill="#9aa3b2">FY25 NDAA mandates</text>
    <text x="130" y="206" text-anchor="middle" font-size="12.5" fill="#9aa3b2" dy="-2">reciprocity</text>

    <circle cx="380" cy="220" r="7" fill="#ff8a3d"/>
    <text x="380" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">MAR 2025</text>
    <text x="380" y="280" text-anchor="middle" font-size="12.5" fill="#9aa3b2">Hegseth directive: modern</text>
    <text x="380" y="298" text-anchor="middle" font-size="12.5" fill="#9aa3b2">software acquisition by default</text>

    <circle cx="630" cy="220" r="7" fill="#ff8a3d"/>
    <text x="630" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">JUN 2025</text>
    <text x="630" y="188" text-anchor="middle" font-size="12.5" fill="#9aa3b2">SWFT launches</text>
    <text x="630" y="206" text-anchor="middle" font-size="12.5" fill="#9aa3b2" dy="-2">as a pilot</text>

    <circle cx="880" cy="220" r="7" fill="#ff8a3d"/>
    <text x="880" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">SEP 2025</text>
    <text x="880" y="280" text-anchor="middle" font-size="12.5" fill="#9aa3b2">CSRMC announced</text>
    <text x="880" y="298" text-anchor="middle" font-size="12.5" fill="#9aa3b2">to replace the RMF</text>

    <circle cx="1130" cy="220" r="7" fill="#ff8a3d"/>
    <text x="1130" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff8a3d">EARLY 2026</text>
    <text x="1130" y="188" text-anchor="middle" font-size="12.5" fill="#9aa3b2">SWFT becomes</text>
    <text x="1130" y="206" text-anchor="middle" font-size="12.5" fill="#9aa3b2" dy="-2">the default road</text>

    <circle cx="1340" cy="220" r="7" fill="none" stroke="#5f6a80" stroke-width="2"/>
    <text x="1340" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6b7382">MID 2026</text>
    <text x="1340" y="280" text-anchor="middle" font-size="12.5" fill="#9aa3b2">ATO timelines</text>
    <text x="1340" y="298" text-anchor="middle" font-size="12.5" fill="#9aa3b2">still stalling</text>
  </g>

  <text x="64" y="378" font-size="14" fill="#ff8a3d">Policy opened the lane. The evidence layer decides who gets to drive in it.</text>
</svg>
