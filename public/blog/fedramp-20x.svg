<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="0.6" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff5c72"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="56" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#ff8a3d">FEDRAMP 20X</text>
  <text x="56" y="94" font-size="27" font-weight="600" fill="#eef1f7">On paper, a sprint. In practice, a marathon.</text>

  <!-- what 20x changes -->
  <rect x="56" y="124" width="1088" height="190" rx="16" fill="#0e1018" stroke="rgba(255,138,61,0.22)"/>
  <text x="84" y="160" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#ff8a3d">WHAT 20X CHANGES · ON PAPER</text>
  <g text-anchor="middle">
    <rect x="84" y="178" width="328" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="248" y="205" font-size="13.5" font-weight="600" fill="#eef1f7">Narratives become KSIs</text>
    <text x="248" y="225" font-size="11.5" fill="#9aa3b2">Key Security Indicators, not prose</text>
    <rect x="436" y="178" width="328" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="600" y="205" font-size="13.5" font-weight="600" fill="#eef1f7">Evidence becomes machine-readable</text>
    <text x="600" y="225" font-size="11.5" fill="#9aa3b2">OSCAL and JSON, not Word</text>
    <rect x="788" y="178" width="328" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="952" y="205" font-size="13.5" font-weight="600" fill="#eef1f7">Validation becomes continuous</text>
    <text x="952" y="225" font-size="11.5" fill="#9aa3b2">checks that run, not checks that are written</text>
  </g>
  <rect x="84" y="272" width="150" height="10" rx="4" fill="url(#sunset)"/>
  <text x="248" y="281" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa3b2">90 days, on paper</text>

  <!-- what does not move -->
  <rect x="56" y="334" width="1088" height="214" rx="16" fill="#0e1018" stroke="rgba(255,255,255,0.08)"/>
  <text x="84" y="370" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#6b7382">WHAT DOES NOT MOVE</text>
  <g text-anchor="middle">
    <rect x="84" y="390" width="240" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="204" y="417" font-size="13" font-weight="600" fill="#9aa3b2">DISA owns the DoW lane</text>
    <text x="204" y="437" font-size="11.5" fill="#6b7382">20x does not bind it</text>
    <rect x="348" y="390" width="240" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="468" y="417" font-size="13" font-weight="600" fill="#9aa3b2">The 3PAO skills gap</text>
    <text x="468" y="437" font-size="11.5" fill="#6b7382">assessors of prose, not pipelines</text>
    <rect x="612" y="390" width="240" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="732" y="417" font-size="13" font-weight="600" fill="#9aa3b2">GRC platforms lag</text>
    <text x="732" y="437" font-size="11.5" fill="#6b7382">built to store narratives</text>
    <rect x="876" y="390" width="240" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="996" y="417" font-size="13" font-weight="600" fill="#9aa3b2">Agencies read it differently</text>
    <text x="996" y="437" font-size="11.5" fill="#6b7382">no single interpretation</text>
  </g>
  <rect x="84" y="484" width="840" height="10" rx="4" fill="#5f6a80"/>
  <text x="1116" y="493" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa3b2">the marathon in practice</text>

  <line x1="56" y1="576" x2="1144" y2="576" stroke="rgba(255,255,255,0.06)"/>
  <text x="56" y="606" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">gooptimal.io · field notes</text>
  <text x="1144" y="606" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">FEDRAMP 20X · KSI · OSCAL</text>
</svg>
