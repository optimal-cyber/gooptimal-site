<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 330" width="1456" height="330" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="0.6" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff5c72"/></linearGradient>
  </defs>
  <rect width="1456" height="330" fill="url(#bg)"/>
  <text x="64" y="62" font-size="24" font-weight="600" fill="#eef1f7">Where an 18 month authorization actually goes</text>
  <text x="64" y="92" font-size="14" fill="#9aa3b2">Illustrative distribution. Very little of it is security engineering.</text>

  <!-- 1328px = 18 months; segments 5 / 3 / 4 / 4 / 2 mo with 2px gaps -->
  <g>
    <rect x="64"    y="150" width="367" height="44" rx="4" fill="#3d4557"/>
    <rect x="433"   y="150" width="219" height="44" rx="4" fill="#4a5568"/>
    <rect x="654"   y="150" width="293" height="44" rx="4" fill="#57637a"/>
    <rect x="949"   y="150" width="293" height="44" rx="4" fill="#646f88"/>
    <rect x="1244"  y="150" width="148" height="44" rx="4" fill="url(#sunset)"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="247"  y="177" fill="#cdd3e0">5 mo</text>
    <text x="542"  y="177" fill="#cdd3e0">3 mo</text>
    <text x="800"  y="177" fill="#cdd3e0">4 mo</text>
    <text x="1095" y="177" fill="#cdd3e0">4 mo</text>
    <text x="1318" y="177" fill="#1a0e06" font-weight="600">2 mo</text>
  </g>
  <g font-size="12.5" fill="#9aa3b2" text-anchor="middle">
    <text x="247"  y="222">SSP writing and rework</text>
    <text x="542"  y="222">Evidence collection</text>
    <text x="800"  y="222">Assessment and remediation</text>
    <text x="1095" y="222">Queues: AO, 3PAO, PMO</text>
    <text x="1318" y="222" fill="#ff8a3d">Security engineering</text>
  </g>
  <text x="64" y="282" font-size="14" fill="#ff8a3d">Two of the eighteen months touch actual security work.</text>
</svg>
