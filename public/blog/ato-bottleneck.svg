<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a4d"/><stop offset="0.6" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff5c72"/>
    </linearGradient>
    <marker id="dimArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#4a5568"/>
    </marker>
    <marker id="sunArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#ff8a3d"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- header -->
  <text x="56" y="64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#ff8a3d">THE ATO BOTTLENECK</text>
  <text x="56" y="102" font-size="29" font-weight="600" fill="#eef1f7">The framework is sound. The evidence layer is the bottleneck.</text>

  <!-- ===== lane 1: today ===== -->
  <rect x="56" y="140" width="1088" height="182" rx="16" fill="#0e1018" stroke="rgba(255,255,255,0.08)"/>
  <text x="84" y="178" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#6b7382">TODAY · DOCUMENT-DRIVEN</text>
  <text x="1116" y="178" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#6b7382">POINT-IN-TIME · REPEATED ANNUALLY</text>

  <!-- chips -->
  <g text-anchor="middle">
    <rect x="84" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="160" y="223" font-size="13" font-weight="600" fill="#9aa3b2">Categorize</text>
    <text x="160" y="243" font-size="11" fill="#6b7382">FIPS 199</text>
    <rect x="260" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="336" y="223" font-size="13" font-weight="600" fill="#9aa3b2">Write the SSP</text>
    <text x="336" y="243" font-size="11" fill="#6b7382">500+ pages, manual</text>
    <rect x="436" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="512" y="223" font-size="13" font-weight="600" fill="#9aa3b2">Collect evidence</text>
    <text x="512" y="243" font-size="11" fill="#6b7382">screenshots, stale</text>
    <rect x="612" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="688" y="223" font-size="13" font-weight="600" fill="#9aa3b2">Assess</text>
    <text x="688" y="243" font-size="11" fill="#6b7382">3PAO backlog</text>
    <rect x="788" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="864" y="223" font-size="13" font-weight="600" fill="#9aa3b2">AO review</text>
    <text x="864" y="243" font-size="11" fill="#6b7382">months in queue</text>
    <rect x="964" y="196" width="152" height="64" rx="10" fill="#141826" stroke="rgba(255,255,255,0.10)"/>
    <text x="1040" y="223" font-size="13" font-weight="600" fill="#9aa3b2">ATO</text>
    <text x="1040" y="243" font-size="11" fill="#6b7382">stale on arrival</text>
  </g>
  <g stroke="#4a5568" stroke-width="1.5">
    <line x1="238" y1="228" x2="256" y2="228" marker-end="url(#dimArrow)"/>
    <line x1="414" y1="228" x2="432" y2="228" marker-end="url(#dimArrow)"/>
    <line x1="590" y1="228" x2="608" y2="228" marker-end="url(#dimArrow)"/>
    <line x1="766" y1="228" x2="784" y2="228" marker-end="url(#dimArrow)"/>
    <line x1="942" y1="228" x2="960" y2="228" marker-end="url(#dimArrow)"/>
  </g>
  <!-- timeline bar: 900px = 18 months -->
  <rect x="84" y="284" width="900" height="10" rx="4" fill="#5f6a80"/>
  <text x="1116" y="293" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa3b2">12–18 months</text>

  <!-- connector -->
  <rect x="330" y="340" width="540" height="30" rx="15" fill="rgba(255,138,61,0.08)" stroke="rgba(255,138,61,0.35)"/>
  <text x="600" y="359" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#ff8a3d">WHAT CHANGES: EVIDENCE BECOMES AUTOMATIC + CURRENT</text>

  <!-- ===== lane 2: the path forward ===== -->
  <rect x="56" y="388" width="1088" height="200" rx="16" fill="#0e1018" stroke="rgba(255,138,61,0.22)"/>
  <text x="84" y="426" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#ff8a3d">THE PATH FORWARD · EVIDENCE-DRIVEN</text>
  <text x="1116" y="426" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#9aa3b2">AUTHORIZATION AS A LIVING STATE</text>

  <g text-anchor="middle">
    <rect x="84" y="440" width="237" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="202" y="467" font-size="13" font-weight="600" fill="#eef1f7">Build secure-by-design</text>
    <text x="202" y="487" font-size="11" fill="#9aa3b2">IaC + policy-as-code</text>
    <rect x="349" y="440" width="237" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="467" y="467" font-size="13" font-weight="600" fill="#eef1f7">Evidence generates itself</text>
    <text x="467" y="487" font-size="11" fill="#9aa3b2">OSCAL · scans · SBOM</text>
    <rect x="614" y="440" width="237" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="732" y="467" font-size="13" font-weight="600" fill="#eef1f7">Live posture dashboard</text>
    <text x="732" y="487" font-size="11" fill="#9aa3b2">drift visible in real time</text>
    <rect x="879" y="440" width="237" height="64" rx="10" fill="#141826" stroke="rgba(255,138,61,0.4)"/>
    <text x="997" y="467" font-size="13" font-weight="600" fill="#eef1f7">AO decides on live data</text>
    <text x="997" y="487" font-size="11" fill="#9aa3b2">continuous ATO</text>
  </g>
  <g stroke="#ff8a3d" stroke-width="1.5">
    <line x1="323" y1="472" x2="345" y2="472" marker-end="url(#sunArrow)"/>
    <line x1="588" y1="472" x2="610" y2="472" marker-end="url(#sunArrow)"/>
    <line x1="853" y1="472" x2="875" y2="472" marker-end="url(#sunArrow)"/>
  </g>
  <!-- loop back: every change re-validates -->
  <path d="M997 508 L997 530 L467 530 L467 512" fill="none" stroke="#ff8a3d" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#sunArrow)"/>
  <text x="732" y="525" text-anchor="middle" font-size="11" fill="#c9803f">re-validates on every model, manifest, or dependency change</text>

  <!-- timeline: 75px = ~6 weeks on the same scale, then continuous -->
  <rect x="84" y="556" width="75" height="10" rx="4" fill="url(#sunset)"/>
  <line x1="167" y1="561" x2="930" y2="561" stroke="rgba(255,138,61,0.35)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="1116" y="565" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa3b2">weeks, then continuous</text>

  <!-- footer -->
  <line x1="56" y1="632" x2="1144" y2="632" stroke="rgba(255,255,255,0.06)"/>
  <text x="56" y="662" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">gooptimal.io · field notes</text>
  <text x="1144" y="662" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#6b7382">RMF · OSCAL · cATO</text>
</svg>
